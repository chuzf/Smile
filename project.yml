name: Smile
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: com.smilejar
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_LANGUAGE: zh-Hans
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: "-"
targets:
  Smile:
    type: application
    platform: iOS
    sources:
      - path: Smile
        excludes: [Info.plist, Smile.entitlements]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Smile/Smile.entitlements
    info:
      path: Smile/Info.plist
      properties:
        CFBundleDisplayName: 微笑储蓄罐
        CFBundleShortVersionString: "1.0.6"
        CFBundleVersion: "6"
        NSCameraUsageDescription: "微笑储蓄罐需要使用相机，以便你在记账时直接拍摄照片或视频作为记录的配图。例如，拍下刚买到的心愿商品，附在这条存钱记录里。"
        NSPhotoLibraryUsageDescription: "微笑储蓄罐需要访问照片图库，以便你从相册中选择照片或视频添加到储蓄记录。例如，挑选一张旅行照片作为“旅行基金”的封面。"
        NSMicrophoneUsageDescription: "微笑储蓄罐需要使用麦克风，以便你为储蓄记录录制语音备注、或使用听写把说话内容转成文字。例如，用语音记下这笔存款的心情。"
        NSSpeechRecognitionUsageDescription: "微笑储蓄罐使用语音识别，将你的录音和实时听写转换为文字，方便快速输入与搜索记录。例如，说一句话即可自动填入备注栏。"
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleDocumentTypes:
          - CFBundleTypeName: "SmileJar 备份"
            CFBundleTypeRole: Viewer
            LSItemContentTypes:
              - public.zip-archive
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
  SmileTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SmileTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
    dependencies:
      - target: Smile
      - package: swift-snapshot-testing
        product: SnapshotTesting
packages:
  swift-snapshot-testing:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.17.0"
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
