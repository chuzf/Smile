name: Smile
options:
  deploymentTarget:
    iOS: "17.0"
  bundleIdPrefix: com.smilejar
  developmentLanguage: zh-Hans
settings:
  base:
    SWIFT_VERSION: "5.10"
    DEVELOPMENT_LANGUAGE: zh-Hans
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: NO
    GENERATE_INFOPLIST_FILE: NO
    CODE_SIGN_STYLE: Automatic
    CODE_SIGNING_ALLOWED: YES
    CODE_SIGNING_REQUIRED: NO
    CODE_SIGN_IDENTITY: "-"
targets:
  Smile:
    type: application
    platform: iOS
    sources:
      - path: Smile
        excludes: [Info.plist, Smile.entitlements]
    settings:
      base:
        CODE_SIGN_ENTITLEMENTS: Smile/Smile.entitlements
        PRODUCT_BUNDLE_IDENTIFIER: com.chuzhanfeng.smile
    info:
      path: Smile/Info.plist
      properties:
        CFBundleDisplayName: 微笑储蓄罐
        CFBundleShortVersionString: "1.0.6"
        CFBundleVersion: "6"
        LSSupportsOpeningDocumentsInPlace: true
        UIStatusBarStyle: ""
        NSCameraUsageDescription: "微笑储蓄罐需要使用相机，以便你在记账时直接拍摄照片作为记录的配图。例如，拍下和孩子的温馨互动瞬间，放入微笑储蓄罐中。"
        NSPhotoLibraryUsageDescription: "微笑储蓄罐需要访问照片图库，以便你从相册中选择照片或视频添加到储蓄记录。例如，记录孩子的获奖证书到优势储蓄罐中。"
        NSMicrophoneUsageDescription: "微笑储蓄罐需要使用麦克风，以便你为储蓄记录录制语音备注。例如，用语音记当下的心情和感悟。"
        NSSpeechRecognitionUsageDescription: "微笑储蓄罐使用语音识别，将你的录音和实时听写转换为文字，方便快速输入与搜索记录。例如，通过语音转文字的方式便捷记录当下心情和感悟。"
        NSFaceIDUsageDescription: "用于验证身份以查看加密的储蓄罐和条目"
        UILaunchScreen:
          UIColorName: AccentColor
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CFBundleDocumentTypes:
          - CFBundleTypeName: "Smile备份"
            CFBundleTypeRole: Editor
            LSHandlerRank: Owner
            LSItemContentTypes:
              - public.zip-archive
              - com.chuzhanfeng.smilepiggybank.backup
        UTExportedTypeDeclarations:
          - UTTypeConformsTo:
              - public.data
            UTTypeDescription: "Smile 加密备份"
            UTTypeIdentifier: com.chuzhanfeng.smilepiggybank.backup
            UTTypeTagSpecification:
              public.filename-extension:
                - smilejar
    dependencies:
      - package: ZIPFoundation
        product: ZIPFoundation
  SmileTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SmileTests]
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        CODE_SIGNING_ALLOWED: NO
        PRODUCT_BUNDLE_IDENTIFIER: com.chuzhanfeng.SmileTests
    dependencies:
      - target: Smile
      - package: swift-snapshot-testing
        product: SnapshotTesting
packages:
  swift-snapshot-testing:
    url: https://github.com/pointfreeco/swift-snapshot-testing
    from: "1.17.0"
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: "0.9.19"
